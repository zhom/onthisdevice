name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Types, tests, build and pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # The build embeds the tool list with the search model. The other models are not needed
      # to build pages, so CI fetches only this one (7 MB, cut from a 128 MB download).
      - uses: actions/cache@v6
        with:
          path: public/models/minishlab
          key: search-model-${{ hashFiles('src/lib/search/semantic/*.ts') }}
      - run: node scripts/vendor-models.mjs --only /models/minishlab
      # A broken page, a missing registry entry or a file over the host's size limit fails here.
      - run: npm run build
      # Opens every built page in Chromium: page errors, hydration errors, CSP violations and
      # failed requests fail the job.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run smoke:pages

  engine:
    name: Rust engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # rust/rust-toolchain.toml pins the compiler; rustup reads it from the working directory.
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --release --locked
      - name: engine.wasm matches rust/
        run: |
          sh ../scripts/build-engine.sh
          git diff --exit-code ../src/lib/engine/engine.wasm
