name: CI

# Type check and unit tests. Cloudflare Workers Builds builds and deploys each
# push to main itself (see README, "Deployment").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo test --manifest-path rust/Cargo.toml --release --locked
      - name: engine.wasm matches rust/
        run: |
          npm run build:engine
          git diff --exit-code src/lib/engine/engine.wasm
